<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#003399">
</head>
<body>
  <main class="pin-gate" id="pin-gate">
    <h1>Enter your PIN</h1>
    <form id="pin-form">
      <label for="pin-input">PIN</label>
      <input id="pin-input" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
      <button type="submit">Continue</button>
      <p id="pin-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <div id="app-content" hidden>
    <header class="top">
      <h1>Homepage</h1>
      <div class="stripe"></div>
    </header>

    <main>
      <p id="welcome-message" class="welcome-message"></p>
      <div id="next-cleaner-banner" class="next-cleaner-banner" style="display:none;"></div>

      <a class="button-link" href="cleaning/schedule.html">
        <span class="icon">📅</span>
        <span>Cleaning Schedule</span>
      </a>

      <a class="button-link" href="oven/reservations.html">
        <span class="icon">📝</span>
        <span>Oven Reservation</span>
      </a>
    </main>
  </div>

  <script src="script.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    setupPinGate(window.DORM_APP_CONFIG.appsScriptUrl, function () {
      var welcomeMessage = document.getElementById('welcome-message');
      var username = sessionStorage.getItem('dormAppUser');
      welcomeMessage.textContent = username ? 'Welcome ' + username : 'Welcome';
      loadNextEventBanner(window.DORM_APP_CONFIG.appsScriptUrl, 'next-cleaner-banner');
    });
  </script>
</body>
</html>
