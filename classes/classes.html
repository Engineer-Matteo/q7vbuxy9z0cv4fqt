<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesrooster</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="top">
    <h1>Lesrooster</h1>
    <div class="stripe"></div>
  </header>

  <main>
    <a class="back-link" href="../index.html">&larr; Terug naar homepagina</a>
    <h2>Weekly classes</h2>

    <!--
      EDIT BELOW: each .entry-card is one class.
      Copy/paste the block and change the text to add or remove classes.
    -->

    <div class="day-heading">Monday</div>
    <div class="entry-card">
      <div class="title">Example Course Name</div>
      <div class="meta">09:00 – 11:00 · Room D.2.01 · Building D</div>
    </div>

    <div class="day-heading">Tuesday</div>
    <div class="entry-card">
      <div class="title">Another Course</div>
      <div class="meta">13:00 – 15:00 · Room U.2.15 · Building U</div>
    </div>

    <!-- Add more days/entries as needed -->

  </main>

  <div class="access-bar">
    <button id="font-dec" aria-label="Decrease text size">A−</button>
    <span>Tekst grootte</span>
    <button id="font-inc" aria-label="Increase text size">A+</button>
  </div>

  <script src="../script.js"></script>
</body>
</html>
