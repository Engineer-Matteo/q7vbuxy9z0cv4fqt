<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examenrooster</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="top">
    <h1>Examenrooster</h1>
    <div class="stripe"></div>
  </header>

  <main>
    <a class="back-link" href="../index.html">&larr; Terug naar homepagina</a>
    <h2>Komende examens</h2>

    <div id="exams-list">
      <div class="empty-msg">Laden...</div>
    </div>

  </main>

  <div class="access-bar">
    <button id="font-dec" aria-label="Decrease text size">A−</button>
    <span>Tekst grootte</span>
    <button id="font-inc" aria-label="Increase text size">A+</button>
  </div>

  <script src="../script.js"></script>
  <script>
    loadCSVList('exams.csv', 'exams-list', function (row) {
      var card = document.createElement('div');
      card.className = 'entry-card';
 
      var title = document.createElement('div');
      title.className = 'title';
      title.textContent = row.course;
 
      var meta = document.createElement('div');
      meta.className = 'meta';
      var metaText = row.date + ' \u00b7 ' + row.time;
      if (row.room) metaText += ' \u00b7 ' + row.room;
      meta.textContent = metaText;
 
      card.appendChild(title);
      card.appendChild(meta);
      return card;
    });
  </script>
</body>
</html>
